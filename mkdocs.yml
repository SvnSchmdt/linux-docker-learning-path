site_name: Linux & Docker Learning Path
site_description: A practical Linux and Docker learning path from your first terminal command to production-ready container workflows
site_author: Sven Schmidt
site_url: https://svnschmdt.github.io/linux-docker-learning-path/
repo_name: svnschmdt/linux-docker-learning-path
repo_url: https://github.com/svnschmdt/linux-docker-learning-path
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: Linux & Docker Learning Path
        - locale: de
          name: Deutsch
          build: true
          site_name: Linux & Docker Learning Path

nav:
  - Home: index.md
  - Roadmap:
    - roadmap/index.md
    - Overview: roadmap/00-overview.md
    - Learning Path: roadmap/01-learning-path.md
    - Checkpoints: roadmap/02-checkpoints.md
  - Modules:
